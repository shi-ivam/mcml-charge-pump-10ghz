            - figure "PLL charge pump" [ref=e125]:
              - link [ref=e126] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:ChargePumpPLLCircuit.svg
            - paragraph [ref=e129]:
              - text: A charge pump is a kind of
              - link "DC-to-DC converter" [ref=e130] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/DC-to-DC_converter
              - text: that uses
              - link "capacitors" [ref=e131] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Capacitor
              - text: for energetic charge storage to raise or lower
              - link "voltage" [ref=e132] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Voltage
              - text: . Charge-pump circuits are capable of high
              - link "efficiencies" [ref=e133] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Electrical_efficiency
              - text: ", sometimes as high as 90–95%, while being electrically simple circuits."
          - region [ref=e134]:
            - generic [ref=e135]:
              - heading "Description" [level=2] [ref=e136]
              - generic [ref=e137]:
                - link "edit":
                  - /url: /w/index.php?title=Charge_pump&action=edit&section=1
            - paragraph [ref=e138]:
              - text: Charge pumps use some form of switching device to control the connection of a supply voltage across a load through a capacitor in a two stage cycle. In the first stage a capacitor is connected across the supply, charging it to that same voltage. In the second stage the circuit is reconfigured so that the capacitor is in series with the supply and the load. This doubles the voltage across the load - the sum of the original supply and the capacitor voltages. The pulsing nature of the higher voltage switched output is often
              - link "smoothed" [ref=e139] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Smoothing_capacitor
              - text: by the use of an output capacitor.
            - paragraph [ref=e140]:
              - text: An external or secondary circuit drives the switching, typically at tens of kilo
              - link "hertz" [ref=e141] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hertz
              - text: up to several megahertz. The high frequency minimizes the amount of capacitance required, as less charge needs to be stored and dumped in a shorter cycle.
            - paragraph [ref=e142]:
              - text: Charge pumps can double voltages, triple voltages, halve voltages, invert voltages, fractionally multiply or scale voltages (such as ×
              - generic [ref=e143]: 3⁄2
              - text: ", ×"
              - generic [ref=e144]: 4⁄3
              - text: ", ×"
              - generic [ref=e145]: 2⁄3
              - text: ", etc.) and generate arbitrary voltages by quickly alternating between modes, depending on the controller and circuit topology."
            - paragraph [ref=e146]: They are commonly used in low-power electronics (such as mobile phones) to raise and lower voltages for different parts of the circuitry - minimizing power consumption by controlling supply voltages carefully.
          - region [ref=e147]:
            - generic [ref=e148]:
              - heading "Terminology for PLL" [level=2] [ref=e149]
              - generic [ref=e150]:
                - link "edit":
                  - /url: /w/index.php?title=Charge_pump&action=edit&section=2
            - paragraph [ref=e151]:
              - text: The term charge pump is also commonly used in
              - link "phase-locked loop" [ref=e152] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Phase-locked_loop
              - text: (PLL) circuits even though there is no pumping action involved unlike in the circuit discussed above. A PLL charge pump is merely a bipolar switched current source. This means that it can output positive and negative current pulses into the loop filter of the PLL. It cannot produce higher or lower voltages than its power and ground supply levels.
          - region [ref=e153]:
            - generic [ref=e154]:
              - heading "Applications" [level=2] [ref=e155]
              - generic [ref=e156]:
                - link "edit":
                  - /url: /w/index.php?title=Charge_pump&action=edit&section=3
            - list [ref=e157]:
              - listitem [ref=e158]:
                - text: A common application for charge-pump circuits is in
                - link "RS-232" [ref=e159] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/RS-232
                - link "level shifters" [ref=e160] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Logic_level
                - text: ", where they are used to derive positive and negative voltages (often +10"
                - link "V" [ref=e161] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Volt
                - text: and −10 V) from a single 5 V or 3 V
                - link "power supply rail" [ref=e162] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Power_supply_rail
                - text: .
              - listitem [ref=e163]:
                - text: Charge pumps can also be used as
                - link "LCD" [ref=e164] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/LCD
                - text: or white-
                - link "LED" [ref=e165] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/LED
                - text: drivers, generating high bias voltages from a single low-voltage supply, such as a battery.
              - listitem [ref=e166]:
                - text: Charge pumps are extensively used in NMOS memories and microprocessors to generate a negative voltage "VBB" (about −3 V), which is connected to the substrate. This guarantees that all N+-to-substrate junctions are reversely biased by 3 V or more, decreasing junction capacitance and increasing circuit speed.
                - superscript [ref=e167]:
                  - link "[1]" [ref=e168] [cursor=pointer]:
                    - /url: "#cite_note-1"
              - listitem [ref=e170]:
                - text: A charge pump providing a negative
                - link "voltage spike" [ref=e171] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Voltage_spike
                - text: has been used in NES-compatible games not licensed by Nintendo in order to stun the
                - link "Nintendo Entertainment System lockout chip" [ref=e172] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/10NES
                - text: .
                - superscript [ref=e173]:
                  - link "[2]" [ref=e174] [cursor=pointer]:
                    - /url: "#cite_note-2"
              - listitem [ref=e176]:
                - text: As of 2007, charge pumps are integrated into nearly all
                - link "EEPROM" [ref=e177] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/EEPROM
                - text: and
                - link "flash-memory" [ref=e178] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Flash_memory
                - text: "integrated circuits. These devices require a high-voltage pulse to \"clean out\" any existing data in a particular memory cell before it can be written with a new value. Early EEPROM and flash-memory devices required two power supplies: +5 V (for reading) and +12 V (for erasing). As of 2007 , commercially available flash memory and EEPROM memory requires only one external power supply – generally 1.8 V or 3.3 V. A higher voltage, used to erase cells, is generated internally by an on-chip charge pump."
              - listitem [ref=e179]:
                - text: Charge pumps are used in
                - link "H bridges" [ref=e180] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/H_bridge
                - text: in high-side drivers for
                - link "gate-driving" [ref=e181] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gate_driver
                - text: high-side n-channel
                - link "power MOSFETs" [ref=e182] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Power_MOSFET
                - text: and
                - link "IGBTs" [ref=e183] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IGBT
                - text: . When the centre of a half bridge goes low, the capacitor is charged through a diode, and this charge is used to later drive the gate of the high-side FET a few volts above the source voltage so as to switch it on. This strategy works well, provided the bridge is regularly switched and avoids the complexity of having to run a separate power supply and permits the more efficient n-channel devices to be used for both switches. This circuit (requiring the periodic switching of the high-side FET) may also be called a "bootstrap" circuit, and some would differentiate between that and a charge pump (which would not require that switching).
              - listitem [ref=e184]:
                - text: High-voltage vertical deflection signal generation for
                - link "cathode-ray tube" [ref=e185] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cathode-ray_tube
                - text: (CRT) monitors, done for example with the TDA1670A integrated circuit. To achieve maximum deviation, a CRT coil needs around 50 V. Using a charge pump voltage doubler from an existing 24 V supply eliminates the need for another supply voltage.
              - listitem [ref=e186]:
                - text: Higher-power
                - link "fast charge" [ref=e187] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charge_controller
                - text: solutions for mobile devices rely on a charge pump instead of a
                - link "buck converter" [ref=e188] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Buck_converter
                - text: to reduce the voltage, as higher efficiency reduces heat generation. The Samsung A23, which takes an input current of 3
                - link "A" [ref=e189] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ampere
                - text: ", can charge its internal battery packs at 6 A thanks to a 2:1 current pump."
                - superscript [ref=e190]:
                  - link "[3]" [ref=e191] [cursor=pointer]:
                    - /url: "#cite_note-3"
                - text: Oppo's 240
                - link "W" [ref=e193] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Watt
                - link "SUPERVOOC" [ref=e194] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/VOOC
                - text: goes further and uses three charge pumps in parallel (98% claimed efficiency
                - superscript [ref=e195]:
                  - link "[4]" [ref=e196] [cursor=pointer]:
                    - /url: "#cite_note-4"
                - text: ) to go from 24V/10A to 10V/24A, which is then taken by two parallel battery packs.
                - superscript [ref=e198]:
                  - link "[5]" [ref=e199] [cursor=pointer]:
                    - /url: "#cite_note-5"
